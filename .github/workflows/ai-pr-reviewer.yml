name: Jules AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 변경점(diff)을 비교하기 위해 전체 히스토리 필요

      - name: Set up Environment (Node.js or Python)
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Jules CLI 환경에 맞춰서 세팅 (파이썬이면 setup-python 사용)

      - name: Install Jules CLI
        run: |
          # 네가 로컬에서 Jules를 설치할 때 쓰는 명령어 입력
          # 예: npm install -g jules-cli 혹은 pip install jules
          echo "Jules 설치 완료"

      - name: Generate diff and run Jules
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh cli 사용을 위한 기본 토큰
        run: |
          # 1. PR의 타겟 브랜치(base)와 현재 변경점(HEAD) 비교해서 diff 추출
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

          # 2. Jules(Gemini Pro)에게 diff 파일을 넘기고 코드 리뷰 지시
          # (아래 명령어는 네가 평소 터미널에서 쓰는 Jules 실행 포맷에 맞게 수정해야 함)
          REVIEW_RESULT=$(jules --model gemini-pro --prompt "이 코드의 변경점을 리뷰해주고, 버그 가능성이나 개선점을 알려줘." --file pr_diff.txt)

          # 3. GitHub CLI를 사용해서 PR에 리뷰 결과를 코멘트로 달기
          gh pr comment ${{ github.event.pull_request.number }} --body "$REVIEW_RESULT"
