<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doorlock Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .alert-blink {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .status-badge {
            font-size: 0.85em;
            padding: 5px 10px;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">2FA Doorlock</a>
            <div>
                <a href="/users_page" class="btn btn-outline-info btn-sm me-2">Users</a>
                <a href="/register" class="btn btn-outline-light btn-sm">Add</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                
                <div id="alert-box" class="alert alert-danger alert-blink shadow" style="display: none;" role="alert">
                    <h4 class="alert-heading text-center mb-0">Repeated failed access attempts detected.</h4>
                </div>

                <div class="card shadow">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-primary">Access Logs</h5>
                        <small class="text-muted" id="last-updated">Updating...</small>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped mb-0 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Time</th>
                                        <th>User</th>
                                        <th>Method</th>
                                        <th>Status</th>
                                        <th>Snapshot</th>
                                    </tr>
                                </thead>
                                <tbody id="log-body">
                                    <tr><td colspan="5" class="text-center py-4">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Snapshot Modal -->
    <div class="modal fade" id="snapshotModal" tabindex="-1" aria-labelledby="snapshotModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="snapshotModalLabel">Snapshot</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center bg-black">
                    <img id="snapshotImage" src="" alt="Snapshot" style="max-width: 100%; max-height: 400px; border-radius: 5px;">
                </div>
            </div>
        </div>
    </div>

    <script>
        let snapshotModal;
        document.addEventListener("DOMContentLoaded", () => {
            snapshotModal = new bootstrap.Modal(document.getElementById('snapshotModal'));
        });

        const escapeHtml = (value) => {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(value ?? '').replace(/[&<>"']/g, (char) => map[char]);
        };

        function showSnapshot(logId) {
            const img = document.getElementById('snapshotImage');
            img.src = `/api/logs/${encodeURIComponent(logId)}/snapshot?t=${new Date().getTime()}`; // cache busting
            snapshotModal.show();
        }

        const getStatusBadge = (status) => {
            const statusValue = String(status ?? '');
            const safeStatus = escapeHtml(statusValue);
            if (statusValue.includes('SUCCESS')) {
                return `<span class="badge bg-success status-badge">${safeStatus}</span>`;
            } else if (statusValue.includes('FAIL') || statusValue.includes('DENIED') || statusValue.includes('UNAUTHORIZED')) {
                return `<span class="badge bg-danger status-badge">${safeStatus}</span>`;
            } else {
                return `<span class="badge bg-secondary status-badge">${safeStatus}</span>`;
            }
        };

        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                const payload = await response.json();
                const logs = Array.isArray(payload) ? payload : (payload.logs || []);
                const tableBody = document.getElementById('log-body');
                const alertBox = document.getElementById('alert-box');
                const lastUpdated = document.getElementById('last-updated');
                
                tableBody.innerHTML = '';
                let failCount = 0;
                let foundSuccess = false;

                logs.forEach((log) => {
                    const row = tableBody.insertRow();
                    const logId = Number(log.id);

                    row.innerHTML = `
                        <td class="ps-4">${escapeHtml(log.timestamp)}</td>
                        <td class="fw-bold">${escapeHtml(log.username || 'Unknown')}</td>
                        <td>${escapeHtml(log.method)}</td>
                        <td>${getStatusBadge(log.status)}</td>
                        <td class="snapshot-cell"></td>
                    `;

                    const snapshotCell = row.querySelector('.snapshot-cell');
                    if (log.has_snapshot && Number.isFinite(logId)) {
                        const button = document.createElement('button');
                        button.className = 'btn btn-sm btn-outline-danger py-0';
                        button.type = 'button';
                        button.textContent = 'View';
                        button.addEventListener('click', () => showSnapshot(logId));
                        snapshotCell.appendChild(button);
                    } else {
                        const empty = document.createElement('span');
                        empty.className = 'text-muted';
                        empty.textContent = '-';
                        snapshotCell.appendChild(empty);
                    }
                    
                    // 최신 로그부터 연속 실패 횟수를 센다.
                    if (!foundSuccess) {
                        if (log.status === 'UNAUTHORIZED' || log.status === 'FINAL_FAIL') {
                            failCount++;
                        } else if (log.status === 'FINAL_SUCCESS' || log.status === '1ST_AUTH_SUCCESS') {
                            // 성공 기록이 나오면 연속 실패가 끊긴다.
                            foundSuccess = true;
                        }
                    }
                });

                const alertActive = Array.isArray(payload) ? failCount >= 3 : Boolean(payload.alert);
                if (alertActive) {
                    alertBox.style.display = 'block';
                } else {
                    alertBox.style.display = 'none';
                }

                const now = new Date();
                lastUpdated.innerText = `Updated: ${now.toLocaleTimeString()}`;

            } catch (err) {
                console.error("Failed to fetch logs:", err);
            }
        }
        
        setInterval(fetchLogs, 2000);
        window.onload = fetchLogs;
    </script>
</body>
</html>
