<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 로그 — 2차 인증 스마트 도어락</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=swap" rel="stylesheet">
    <link href="/static/app.css" rel="stylesheet">
</head>
<body class="ide-page records-page">
    <header class="ide-topbar">
        <div class="ide-brand">
            <span class="ide-brand-mark"><span class="material-symbols-rounded" aria-hidden="true">list_alt</span></span>
            <span>
                <span class="ide-brand-title">전체 기록</span>
                <span class="ide-brand-subtitle">출입, 인증, 차단 이벤트 이력</span>
            </span>
        </div>
        <nav class="ide-tabs">
            <a href="/" class="ide-tab"><span class="material-symbols-rounded" aria-hidden="true">dashboard</span>대시보드</a>
            <a href="/hardware" class="ide-tab"><span class="material-symbols-rounded" aria-hidden="true">developer_board</span>하드웨어</a>
            <a href="/logs_page" class="ide-tab active"><span class="material-symbols-rounded" aria-hidden="true">list_alt</span>전체 기록</a>
            <a href="/users_page" class="ide-tab"><span class="material-symbols-rounded" aria-hidden="true">groups</span>사용자 관리</a>
        </nav>
    </header>

    <main class="records-shell">
        <section class="records-summary">
            <div class="records-summary-item">
                <span>전체 기록</span>
                <strong id="records-total">-</strong>
            </div>
            <div class="records-summary-item">
                <span>화면 표시</span>
                <strong id="records-visible">-</strong>
            </div>
            <div class="records-summary-item">
                <span>경고 상태</span>
                <strong id="records-alert">확인 중</strong>
            </div>
        </section>

        <section class="ide-log-panel records-panel">
            <div class="ide-pane-head">
                <div>
                    <h2>시스템 이벤트</h2>
                    <span id="log-summary">로그를 불러오는 중...</span>
                </div>
                <button class="ide-button" type="button" onclick="fetchLogs()">
                    <span class="material-symbols-rounded" aria-hidden="true">refresh</span>새로고침
                </button>
            </div>
            <div class="table-responsive">
                <table class="log-table align-middle">
                    <thead>
                        <tr>
                            <th class="ps-4">시간</th>
                            <th>사용자</th>
                            <th>인증 수단</th>
                            <th>결과</th>
                            <th class="pe-4">인증 사진</th>
                        </tr>
                    </thead>
                    <tbody id="all-log-body">
                        <tr><td colspan="5" class="empty-cell">시스템 로그를 불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const escapeHtml = (value) => {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(value ?? '').replace(/[&<>"']/g, (char) => map[char]);
        };
        const displayUsername = (value) => {
            const text = String(value || '').trim();
            return text && text !== 'Unknown' ? text : '알 수 없음';
        };
        const getStatusBadge = (status) => {
            const value = String(status ?? '');
            const safe = escapeHtml(value);
            if (value.includes('SUCCESS')) return `<span class="status-badge bg-success">${safe}</span>`;
            if (value.includes('FAIL') || value.includes('DENIED') || value.includes('UNAUTHORIZED')) return `<span class="status-badge bg-danger">${safe}</span>`;
            return `<span class="status-badge bg-secondary">${safe}</span>`;
        };

        async function fetchLogs() {
            const body = document.getElementById('all-log-body');
            const summary = document.getElementById('log-summary');
            try {
                const response = await fetch('/api/logs?limit=200');
                const payload = await response.json();
                const logs = payload.logs || [];
                summary.textContent = `총 ${payload.total || logs.length}개 중 최근 ${logs.length}개 표시`;
                document.getElementById('records-total').textContent = payload.total || logs.length;
                document.getElementById('records-visible').textContent = logs.length;
                document.getElementById('records-alert').textContent = payload.alert ? '주의 필요' : '정상';
                body.innerHTML = '';
                if (logs.length === 0) {
                    body.innerHTML = '<tr><td colspan="5" class="empty-cell">표시할 로그가 없습니다.</td></tr>';
                    return;
                }
                logs.forEach((log) => {
                    const row = body.insertRow();
                    row.innerHTML = `
                        <td class="ps-4 mono">${escapeHtml(log.timestamp)}</td>
                        <td>${escapeHtml(displayUsername(log.username))}</td>
                        <td><span class="method-pill">${escapeHtml(log.method)}</span></td>
                        <td>${getStatusBadge(log.status)}</td>
                        <td class="pe-4">${log.has_snapshot ? '사진 있음' : '-'}</td>
                    `;
                });
            } catch (err) {
                summary.textContent = '동기화 실패';
                document.getElementById('records-alert').textContent = '오류';
                body.innerHTML = '<tr><td colspan="5" class="empty-cell text-danger">로그를 불러오지 못했습니다.</td></tr>';
            }
        }

        window.onload = fetchLogs;
    </script>
</body>
</html>
