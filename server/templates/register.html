<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - Doorlock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .capture-preview {
            width: 100%;
            height: 200px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px dashed #ccc;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">2FA Doorlock</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Add User</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Face Capture</label>
                            <div class="capture-preview" id="previewContainer" style="overflow:hidden; padding:0; background:black;">
                                <img src="/video_feed" alt="Live Camera Feed" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                            <button type="button" id="btnCapture" class="btn btn-outline-secondary w-100">Capture Face</button>
                            <div id="captureMsg" class="small mt-1 text-center"></div>
                        </div>

                        <hr>

                        <form id="regForm">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" id="name" class="form-control" placeholder="Enter name" maxlength="80" autocomplete="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">NFC UID</label>
                                <input type="text" id="nfc_uid" class="form-control" placeholder="e.g. A1B2C3D4" pattern="[0-9A-Fa-f]{4,32}" maxlength="32" autocomplete="off" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password (PIN)</label>
                                <input type="password" id="password" class="form-control" placeholder="Enter 4-8 digit PIN" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="new-password" required>
                            </div>
                            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 mt-3">
                                <span id="submitSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                <span id="submitText">Save User</span>
                            </button>
                        </form>
                        <div id="msg" class="mt-3 text-center"></div>
                        <div class="text-center mt-3">
                            <a href="/" class="btn btn-link">Back to Logs</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let faceCaptured = false;

        function setInlineMessage(element, success, message) {
            element.textContent = message;
            element.className = `small mt-1 text-center ${success ? 'text-success' : 'text-danger'}`;
        }

        function setAlertMessage(element, success, message) {
            element.innerHTML = '';
            const alert = document.createElement('div');
            alert.className = `alert ${success ? 'alert-success' : 'alert-danger'}`;
            alert.textContent = message;
            element.appendChild(alert);
        }

        document.getElementById('btnCapture').onclick = async () => {
            const btn = document.getElementById('btnCapture');
            btn.disabled = true;
            btn.innerText = "Capturing...";
            
            try {
                const resp = await fetch('/api/capture_face', { method: 'POST' });
                const result = await resp.json();
                const captureMsg = document.getElementById('captureMsg');
                
                if (result.success) {
                    setInlineMessage(captureMsg, true, result.message);
                    faceCaptured = true;
                } else {
                    setInlineMessage(captureMsg, false, result.message);
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "Capture Face";
            }
        };

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            
            if (!faceCaptured) {
                if (!confirm("Face has not been captured yet. Continue anyway?")) return;
            }

            const btnSubmit = document.getElementById('btnSubmit');
            const submitSpinner = document.getElementById('submitSpinner');
            const submitText = document.getElementById('submitText');

            btnSubmit.disabled = true;
            submitSpinner.classList.remove('d-none');
            submitText.textContent = 'Saving...';

            const data = {
                name: document.getElementById('name').value,
                nfc_uid: document.getElementById('nfc_uid').value,
                password: document.getElementById('password').value
            };
            
            try {
                const resp = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                const result = await resp.json();
                const msgDiv = document.getElementById('msg');
                if (result.success) {
                    setAlertMessage(msgDiv, true, result.message);
                    document.getElementById('regForm').reset();
                    document.getElementById('captureMsg').textContent = "";
                    faceCaptured = false;
                } else {
                    setAlertMessage(msgDiv, false, result.message);
                }
            } catch (err) {
                console.error(err);
                const msgDiv = document.getElementById('msg');
                setAlertMessage(msgDiv, false, "Network error occurred.");
            } finally {
                btnSubmit.disabled = false;
                submitSpinner.classList.add('d-none');
                submitText.textContent = 'Save User';
            }
        };
    </script>
</body>
</html>
