<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 등록 — 2차 인증 스마트 도어락</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=swap" rel="stylesheet">
    <link href="/static/app.css" rel="stylesheet">
</head>
<body class="register-page">
    <header class="app-topbar">
        <div class="topbar-inner">
            <a class="brand-block text-decoration-none text-reset" href="/">
                <span class="brand-mark"><span class="material-symbols-rounded" aria-hidden="true">person_add</span></span>
                <span>
                    <span class="brand-title">사용자 등록</span>
                    <span class="brand-subtitle">사용자 정보와 인증 수단 등록</span>
                </span>
            </a>
            <nav class="topbar-actions">
                <a href="/users_page" class="btn-tool primary"><span class="material-symbols-rounded" aria-hidden="true">groups</span> 사용자 관리</a>
                <a href="/" class="btn-tool"><span class="material-symbols-rounded" aria-hidden="true">dashboard</span> 대시보드</a>
            </nav>
        </div>
    </header>

    <main class="page-shell page-grid">
        <section class="panel panel-pad">
            <div class="panel-head">
                <div>
                    <h1 class="panel-title">새 사용자 등록</h1>
                    <div class="panel-caption">사용자 정보, NFC, PIN, 얼굴 정보를 한 번에 등록합니다.</div>
                </div>
                <span class="status-badge bg-secondary">등록</span>
            </div>

            <div class="form-layout">
                <div class="form-section">
                    <div class="panel-head">
                        <div>
                            <h2 class="panel-title">얼굴 캡처</h2>
                            <div class="panel-caption">현재 카메라 입력</div>
                        </div>
                        <span class="status-badge bg-secondary">얼굴</span>
                    </div>
                    <div class="feed-shell">
                        <img data-src="/video_feed" class="camera-preview" alt="카메라 화면">
                    </div>
                    <button id="btnCapture" class="capture-button" type="button">
                        <span class="material-symbols-rounded me-2" aria-hidden="true">photo_camera</span>얼굴 정보 캡처
                    </button>
                    <div id="captureMsg" class="status-message text-center" aria-live="polite"></div>
                </div>

                <div class="form-section">
                    <div class="panel-head">
                        <div>
                            <h2 class="panel-title">인증 정보</h2>
                            <div class="panel-caption">등록 후 바로 인증 시나리오에 사용됩니다.</div>
                        </div>
                        <span class="status-badge bg-secondary">인증</span>
                    </div>

                    <form id="regForm" class="field-grid">
                        <div>
                            <label for="name" class="form-label">사용자 이름</label>
                            <input type="text" id="name" class="form-control" placeholder="홍길동" maxlength="80" autocomplete="name" required>
                        </div>
                        <div>
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" id="email" class="form-control" placeholder="student@school.local" maxlength="120" autocomplete="email">
                        </div>
                        <div>
                            <label for="phone" class="form-label">연락처</label>
                            <input type="tel" id="phone" class="form-control" placeholder="010-0000-0000" maxlength="40" autocomplete="tel">
                        </div>
                        <div>
                            <label for="address" class="form-label">주소</label>
                            <input type="text" id="address" class="form-control" placeholder="학교 실습실 또는 등록 주소" maxlength="180" autocomplete="street-address">
                        </div>
                        <div>
                            <label for="nfc_uid" class="form-label">NFC UID (HEX)</label>
                            <div class="input-group">
                                <input type="text" id="nfc_uid" class="form-control" placeholder="A1B2C3D4" pattern="[0-9A-Fa-f]{4,32}" maxlength="32" autocomplete="off" required>
                                <button id="btnNfcCapture" class="btn btn-outline-secondary" type="button">
                                    <span class="material-symbols-rounded me-1" aria-hidden="true">contactless</span>NFC 태그
                                </button>
                            </div>
                            <div id="nfcCaptureMsg" class="form-help" aria-live="polite">MFRC522에서 읽은 UID를 HEX 형식으로 입력</div>
                        </div>
                        <div>
                            <label for="password" class="form-label">PIN (숫자 4자리)</label>
                            <input type="password" id="password" class="form-control" placeholder="1234" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" required>
                        </div>

                        <button type="submit" id="btnSubmit" class="submit-button">
                            <span id="submitSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                            <span id="submitText">사용자 등록</span>
                        </button>
                    </form>
                    <div id="msg" class="mt-3" aria-live="polite"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let faceCaptured = false;
        let nfcCapturePoll = null;
        let nfcCountdown = null;

        document.addEventListener("DOMContentLoaded", () => {
            setupCameraFeed('.camera-preview');
        });

        function setupCameraFeed(selector) {
            const img = document.querySelector(selector);
            if (!img) return;
            const streamUrl = img.dataset.src || '/video_feed';
            const start = () => {
                if (!document.hidden && !img.getAttribute('src')) {
                    img.src = `${streamUrl}?t=${Date.now()}`;
                }
            };
            const stop = () => {
                img.removeAttribute('src');
            };
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) stop();
                else start();
            });
            window.addEventListener('pagehide', stop);
            window.addEventListener('beforeunload', stop);
            start();
        }

        const escapeHtml = (value) => {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(value ?? '').replace(/[&<>"']/g, (char) => map[char]);
        };

        function setStatus(el, ok, msg) {
            el.className = `status-message text-center ${ok ? 'success' : 'error'}`;
            el.textContent = msg;
        }

        function setMessage(el, ok, msg) {
            el.innerHTML = `<div class="notice ${ok ? 'success' : 'error'}">${escapeHtml(msg)}</div>`;
        }

        document.getElementById('btnCapture').onclick = async () => {
            const btn = document.getElementById('btnCapture');
            const msg = document.getElementById('captureMsg');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>캡처 중...';
            msg.textContent = '';
            msg.className = 'status-message text-center';

            try {
                const r = await fetch('/api/capture_face', { method: 'POST' });
                const j = await r.json();
                if (j.success) {
                    setStatus(msg, true, `완료: ${j.message}`);
                    faceCaptured = true;
                } else {
                    setStatus(msg, false, j.message || '얼굴 정보 캡처에 실패했습니다.');
                }
            } catch (e) {
                setStatus(msg, false, '캡처 중 네트워크 오류가 발생했습니다.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-rounded me-2" aria-hidden="true">photo_camera</span>얼굴 정보 캡처';
            }
        };

        function stopNfcCaptureTimers() {
            if (nfcCapturePoll) clearInterval(nfcCapturePoll);
            if (nfcCountdown) clearInterval(nfcCountdown);
            nfcCapturePoll = null;
            nfcCountdown = null;
        }

        function setNfcCaptureMessage(text, ok = null) {
            const msg = document.getElementById('nfcCaptureMsg');
            msg.textContent = text;
            if (ok === true) msg.style.color = '#15803d';
            else if (ok === false) msg.style.color = '#b91c1c';
            else msg.style.color = '';
        }

        document.getElementById('btnNfcCapture').onclick = async () => {
            const btn = document.getElementById('btnNfcCapture');
            stopNfcCaptureTimers();
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>15초';

            try {
                const start = await fetch('/api/nfc_capture/start', { method: 'POST' });
                const started = await start.json();
                if (!started.success) throw new Error(started.message || 'NFC capture failed');

                let remaining = Number(started.capture?.remaining_seconds || 15);
                setNfcCaptureMessage(`NFC 태그 대기 중... ${remaining}초`, null);
                nfcCountdown = setInterval(() => {
                    remaining = Math.max(0, remaining - 1);
                    btn.innerHTML = `<span class="material-symbols-rounded me-1" aria-hidden="true">timer</span>${remaining}초`;
                    setNfcCaptureMessage(`NFC 태그 대기 중... ${remaining}초`, null);
                    if (remaining <= 0) {
                        stopNfcCaptureTimers();
                        btn.disabled = false;
                        btn.innerHTML = '<span class="material-symbols-rounded me-1" aria-hidden="true">contactless</span>NFC 태그';
                        setNfcCaptureMessage('NFC 태그를 읽지 못했습니다.', false);
                    }
                }, 1000);

                nfcCapturePoll = setInterval(async () => {
                    const res = await fetch('/api/nfc_capture/status');
                    const data = await res.json();
                    const capture = data.capture || {};
                    if (capture.uid) {
                        document.getElementById('nfc_uid').value = String(capture.uid).toUpperCase();
                        stopNfcCaptureTimers();
                        btn.disabled = false;
                        btn.innerHTML = '<span class="material-symbols-rounded me-1" aria-hidden="true">contactless</span>NFC 태그';
                        setNfcCaptureMessage(`NFC UID ${capture.uid} 읽음`, true);
                    } else if (!capture.active && Number(capture.remaining_seconds || 0) <= 0) {
                        stopNfcCaptureTimers();
                        btn.disabled = false;
                        btn.innerHTML = '<span class="material-symbols-rounded me-1" aria-hidden="true">contactless</span>NFC 태그';
                        setNfcCaptureMessage('NFC 태그를 읽지 못했습니다.', false);
                    }
                }, 800);
            } catch (e) {
                stopNfcCaptureTimers();
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-rounded me-1" aria-hidden="true">contactless</span>NFC 태그';
                setNfcCaptureMessage('NFC 캡처를 시작하지 못했습니다.', false);
            }
        };

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            if (!faceCaptured) {
                setStatus(document.getElementById('captureMsg'), false, '얼굴 정보 캡처 후 등록하세요.');
                setMessage(msg, false, '얼굴 정보 캡처 후 등록하세요.');
                return;
            }

            const btn = document.getElementById('btnSubmit');
            const sp = document.getElementById('submitSpinner');
            const txt = document.getElementById('submitText');

            btn.disabled = true;
            sp.classList.remove('d-none');
            txt.textContent = '등록 중...';

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                address: document.getElementById('address').value.trim(),
                nfc_uid: document.getElementById('nfc_uid').value.trim().toUpperCase(),
                password: document.getElementById('password').value.trim()
            };

            try {
                const r = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const j = await r.json();
                if (j.success) {
                    setMessage(msg, true, j.message);
                    document.getElementById('regForm').reset();
                    document.getElementById('captureMsg').textContent = '';
                    document.getElementById('captureMsg').className = 'status-message text-center';
                    faceCaptured = false;
                } else {
                    setMessage(msg, false, j.message || '등록에 실패했습니다.');
                }
            } catch (e) {
                setMessage(msg, false, '네트워크 오류가 발생했습니다. 서버 콘솔을 확인하세요.');
            } finally {
                btn.disabled = false;
                sp.classList.add('d-none');
                txt.textContent = '사용자 등록';
            }
        };
    </script>
</body>
</html>
